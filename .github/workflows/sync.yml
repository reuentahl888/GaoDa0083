name: 🔄 Auto Update Worker

on:
  push:
    branches: [ main ]
  schedule:
    - cron: "0 1 * * *"  # 🕐 每天凌晨1点自动运行
  workflow_dispatch:      # 🖐️ 支持手动触发

permissions:
  contents: write

jobs:
  update:
    name: 🚀 同步 Worker 文件
    runs-on: ubuntu-latest
    steps:
      - name: 📥 初始化代码仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔍 检查本地版本
        id: local_version
        run: |
          echo "📦 $(date '+%Y-%m-%d %H:%M:%S') - 开始检查本地版本..."
          if [[ -f "version.txt" ]]; then
            LOCAL_VERSION=$(cat version.txt)
            echo "✅ 当前本地版本: $LOCAL_VERSION"
          else
            echo "🆕 首次运行，未找到版本记录"
            LOCAL_VERSION="initial"
          fi
          echo "LOCAL_VERSION=$LOCAL_VERSION" >> $GITHUB_ENV
          echo "::notice title=版本信息::本地版本: $LOCAL_VERSION"

      - name: 🌐 获取远程版本
        id: remote_version
        run: |
          echo "🌍 $(date '+%Y-%m-%d %H:%M:%S') - 正在获取远程文件..."
          RAW_URL="https://raw.githubusercontent.com/cmliu/edgetunnel/refs/heads/main/_worker.js"
          
          # 尝试下载文件并计算哈希
          for i in {1..3}; do
            echo "🔁 第 $i 次尝试下载..."
            if FILE_CONTENT=$(curl -f -s "$RAW_URL"); then
              FILE_HASH=$(echo "$FILE_CONTENT" | sha256sum | cut -d' ' -f1)
              if [[ -n "$FILE_HASH" ]]; then
                echo "✅ 远程文件哈希获取成功: ${FILE_HASH:0:16}..."
                echo "REMOTE_VERSION=$FILE_HASH" >> $GITHUB_ENV
                echo "::notice title=远程版本::文件哈希: ${FILE_HASH:0:16}..."
                break
              fi
            fi
            
            if [[ $i -eq 3 ]]; then
              echo "❌ 下载失败，已达到最大重试次数"
              exit 1
            fi
            sleep 5
          done

      - name: 📊 版本比对
        id: version_check
        run: |
          echo "📊 $(date '+%Y-%m-%d %H:%M:%S') - 开始版本比对..."
          echo "📍 本地版本: ${LOCAL_VERSION:0:16}..."
          echo "📍 远程版本: ${REMOTE_VERSION:0:16}..."
          
          if [[ "$LOCAL_VERSION" == "$REMOTE_VERSION" ]]; then
            echo "🎉 版本一致，无需更新"
            echo "UPDATE_NEEDED=false" >> $GITHUB_ENV
            echo "::notice title=版本状态::当前已是最新版本"
          else
            echo "🔄 检测到新版本，需要更新"
            echo "UPDATE_NEEDED=true" >> $GITHUB_ENV
            echo "::warning title=版本更新::发现新版本，准备更新"
          fi

      - name: ⬇️ 下载最新文件
        if: env.UPDATE_NEEDED == 'true'
        run: |
          echo "⬇️ $(date '+%Y-%m-%d %H:%M:%S') - 开始下载最新文件..."
          RAW_URL="https://raw.githubusercontent.com/cmliu/edgetunnel/refs/heads/main/_worker.js"
          
          # 下载文件
          if curl -f -s -o _worker.js "$RAW_URL"; then
            echo "✅ 文件下载成功"
            
            # 验证文件大小
            FILE_SIZE=$(stat -f%z _worker.js 2>/dev/null || stat -c%s _worker.js 2>/dev/null)
            if [[ $FILE_SIZE -gt 1000 ]]; then
              echo "📏 文件大小: $FILE_SIZE 字节"
              
              # 记录新版本
              echo "$REMOTE_VERSION" > version.txt
              echo "📝 版本记录已更新"
              
              echo "::notice title=下载成功::已下载最新 Worker 文件 ($FILE_SIZE 字节)"
            else
              echo "❌ 文件大小异常，可能下载失败"
              exit 1
            fi
          else
            echo "❌ 文件下载失败"
            exit 1
          fi

      - name: 💾 提交更新
        if: env.UPDATE_NEEDED == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: |
            🔄 Auto Update Worker
            
            • 同步最新 _worker.js 文件
            • 版本哈希: ${{ env.REMOTE_VERSION }}
            • 更新时间: $(date '+%Y-%m-%d %H:%M:%S')
            
            [自动同步]
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          tagging_message: |
            v$(date '+%Y%m%d%H%M%S')

      - name: 🎉 更新完成
        if: env.UPDATE_NEEDED == 'true'
        run: |
          echo "🎉 $(date '+%Y-%m-%d %H:%M:%S') - 自动更新完成！"
          echo "::notice title=更新完成::已成功同步到最新版本"
          echo "📋 更新摘要:"
          echo "   • 旧版本: ${LOCAL_VERSION:0:16}..."
          echo "   • 新版本: ${REMOTE_VERSION:0:16}..."
          echo "   • 文件: _worker.js"
          echo "   • 时间: $(date '+%Y-%m-%d %H:%M:%S')"

      - name: 😴 无需更新
        if: env.UPDATE_NEEDED == 'false'
        run: |
          echo "😴 $(date '+%Y-%m-%d %H:%M:%S') - 当前已是最新版本，无需更新"
          echo "::notice title=状态检查::当前已是最新版本"
