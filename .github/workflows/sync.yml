name: Auto Update Worker

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 1 * * *" # 每天凌晨1点自动运行
  workflow_dispatch:     # 支持手动运行

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 初始化仓库
        uses: actions/checkout@v4

      - name: 获取当前本地版本
        id: get_local_version
        run: |
          echo -e "\033[34m[获取本地版本]\033[0m"
          if [ -f version.txt ]; then
            LOCAL_VERSION=$(cat version.txt)
            echo "当前本地版本: $LOCAL_VERSION"
          else
            echo "首次同步，没有本地版本。"
            LOCAL_VERSION=""
          fi
          echo "LOCAL_VERSION=$LOCAL_VERSION" >> $GITHUB_ENV

      - name: 获取最新文件哈希作为版本
        id: get_remote_version
        run: |
          echo -e "\033[34m[获取远程文件哈希]\033[0m"
          RAW_URL="https://raw.githubusercontent.com/cmliu/edgetunnel/refs/heads/beta2.0/_worker.js"
          # 获取文件内容并计算哈希
          FILE_HASH=$(curl -s "$RAW_URL" | sha256sum | cut -d' ' -f1)
          echo "远程文件哈希: $FILE_HASH"
          echo "REMOTE_VERSION=$FILE_HASH" >> $GITHUB_ENV

      - name: 判断是否需要更新
        id: check_update
        run: |
          echo -e "\033[34m[判断是否需要更新]\033[0m"
          if [ "$LOCAL_VERSION" = "$REMOTE_VERSION" ]; then
            echo -e "\033[32m已经是最新版本，无需更新。\033[0m"
            echo "UPDATE_NEEDED=false" >> $GITHUB_ENV
          else
            echo -e "\033[33m发现新版本，需要更新！\033[0m"
            echo "UPDATE_NEEDED=true" >> $GITHUB_ENV
          fi

      - name: 下载最新 worker 文件
        if: env.UPDATE_NEEDED == 'true'
        run: |
          echo -e "\033[34m[下载最新 _worker.js]\033[0m"
          RAW_URL="https://raw.githubusercontent.com/Setout8/Book-Pen-Book/main/_worker.js"
          curl -s -o _worker.js "$RAW_URL"
          
          echo -e "\033[34m[记录新版本号]\033[0m"
          echo "$REMOTE_VERSION" > version.txt

      - name: 提交更改
        if: env.UPDATE_NEEDED == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🔄 自动同步最新 Worker 版本"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          push_options: --force
