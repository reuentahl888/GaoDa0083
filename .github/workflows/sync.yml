name: 🔄 Auto Update Worker

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 配置 Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: ⬇️ 下载最新文件
        run: |
          curl -s -o _worker.js "https://raw.githubusercontent.com/cmliu/edgetunnel/refs/heads/main/_worker.js"
          curl -s "https://raw.githubusercontent.com/cmliu/edgetunnel/refs/heads/main/_worker.js" | sha256sum | cut -d' ' -f1 > version.txt

      - name: 💾 提交更新
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "没有更改可提交"
            exit 0
          fi
          git commit -m "🔄 自动更新 Worker 文件"
          git push
