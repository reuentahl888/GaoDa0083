name: 🔄 Auto Update Worker

on:
  push:
    branches: [ main ]
  schedule:
    - cron: "0 1 * * *"  # 🕐 每天凌晨1点自动运行
  workflow_dispatch:      # 🖐️ 支持手动触发

permissions:
  contents: write

jobs:
  update:
    name: 🚀 同步和优化 Worker 文件
    runs-on: ubuntu-latest
    steps:
      - name: 📥 初始化代码仓库
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 🔧 配置 Git 和安装依赖
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global pull.rebase false
          
          # 安装 Node.js 和 JavaScript 混淆工具
          echo "📦 安装 JavaScript 混淆工具..."
          npm install -g javascript-obfuscator

      - name: 🔍 检查文件状态
        id: check_files
        run: |
          echo "🔍 $(date '+%Y-%m-%d %H:%M:%S') - 检查文件状态..."
          
          # 检查关键文件是否存在
          if [[ -f "version.txt" ]]; then
            LOCAL_VERSION=$(cat version.txt)
            echo "✅ version.txt 存在，版本: $LOCAL_VERSION"
            echo "HAS_VERSION=true" >> $GITHUB_ENV
          else
            echo "📝 version.txt 不存在"
            echo "HAS_VERSION=false" >> $GITHUB_ENV
          fi
          
          if [[ -f "source.js" ]]; then
            echo "✅ source.js 存在"
            echo "HAS_SOURCE=true" >> $GITHUB_ENV
          else
            echo "📝 source.js 不存在"
            echo "HAS_SOURCE=false" >> $GITHUB_ENV
          fi
          
          if [[ -f "_worker.js" ]]; then
            echo "✅ _worker.js 存在"
            echo "HAS_WORKER=true" >> $GITHUB_ENV
          else
            echo "📝 _worker.js 不存在"
            echo "HAS_WORKER=false" >> $GITHUB_ENV
          fi
          
          # 如果有任何一个文件不存在，就强制更新
          if [[ "$HAS_VERSION" == "false" || "$HAS_SOURCE" == "false" || "$HAS_WORKER" == "false" ]]; then
            echo "🔄 检测到文件缺失，需要强制更新"
            echo "FORCE_UPDATE=true" >> $GITHUB_ENV
          else
            echo "FORCE_UPDATE=false" >> $GITHUB_ENV
          fi

      - name: 🌐 获取远程文件信息
        id: remote_info
        run: |
          echo "🌍 $(date '+%Y-%m-%d %H:%M:%S') - 正在获取远程文件..."
          RAW_URL="https://raw.githubusercontent.com/cmliu/edgetunnel/refs/heads/main/_worker.js"
          
          # 尝试下载文件并计算哈希
          for i in {1..3}; do
            echo "🔁 第 $i 次尝试获取远程文件..."
            if FILE_CONTENT=$(curl -f -s "$RAW_URL"); then
              if [[ -n "$FILE_CONTENT" ]]; then
                FILE_HASH=$(echo "$FILE_CONTENT" | sha256sum | cut -d' ' -f1)
                echo "✅ 远程文件获取成功，哈希: ${FILE_HASH:0:16}..."
                echo "REMOTE_VERSION=$FILE_HASH" >> $GITHUB_ENV
                echo "::notice title=远程版本::文件哈希: ${FILE_HASH:0:16}..."
                
                # 保存文件内容用于后续步骤
                echo "$FILE_CONTENT" > /tmp/remote_worker.js
                break
              fi
            fi
            
            if [[ $i -eq 3 ]]; then
              echo "❌ 获取远程文件失败，已达到最大重试次数"
              exit 1
            fi
            sleep 5
          done

      - name: 📊 版本比对和更新决策
        id: update_decision
        run: |
          echo "📊 $(date '+%Y-%m-%d %H:%M:%S') - 版本比对和更新决策..."
          
          if [[ "$FORCE_UPDATE" == "true" ]]; then
            echo "🔄 文件缺失，强制更新"
            echo "UPDATE_NEEDED=true" >> $GITHUB_ENV
            echo "UPDATE_REASON=文件缺失" >> $GITHUB_ENV
          elif [[ -f "version.txt" ]]; then
            LOCAL_VERSION=$(cat version.txt)
            if [[ "$LOCAL_VERSION" == "$REMOTE_VERSION" ]]; then
              echo "🎉 版本一致，无需更新"
              echo "UPDATE_NEEDED=false" >> $GITHUB_ENV
              echo "UPDATE_REASON=版本一致" >> $GITHUB_ENV
            else
              echo "🔄 检测到新版本，需要更新"
              echo "UPDATE_NEEDED=true" >> $GITHUB_ENV
              echo "UPDATE_REASON=版本更新" >> $GITHUB_ENV
            fi
          else
            echo "🔄 首次运行或版本文件丢失，需要更新"
            echo "UPDATE_NEEDED=true" >> $GITHUB_ENV
            echo "UPDATE_REASON=首次运行" >> $GITHUB_ENV
          fi
          
          echo "::notice title=更新决策::是否需要更新: $UPDATE_NEEDED, 原因: $UPDATE_REASON"

      - name: ⬇️ 下载和处理文件
        if: env.UPDATE_NEEDED == 'true'
        run: |
          echo "⬇️ $(date '+%Y-%m-%d %H:%M:%S') - 开始下载和处理文件..."
          
          # 使用之前保存的远程文件内容
          if [[ -f "/tmp/remote_worker.js" ]]; then
            # 保存原始文件为 source.js
            cp /tmp/remote_worker.js source.js
            echo "✅ source.js 创建成功"
            
            # 复制用于处理
            cp /tmp/remote_worker.js _worker.js
            echo "✅ _worker.js 创建成功"
          else
            echo "❌ 远程文件内容丢失"
            exit 1
          fi
          
          # 验证文件大小
          FILE_SIZE=$(stat -c%s source.js 2>/dev/null || stat -f%z source.js 2>/dev/null)
          if [[ $FILE_SIZE -gt 1000 ]]; then
            echo "📏 源文件大小: $FILE_SIZE 字节"
          else
            echo "❌ 文件大小异常，可能下载失败"
            exit 1
          fi

      - name: 🔒 优化和压缩代码
        if: env.UPDATE_NEEDED == 'true'
        run: |
          echo "🔒 $(date '+%Y-%m-%d %H:%M:%S') - 开始优化代码..."
          
          # 检查 _worker.js 文件是否存在
          if [[ ! -f "_worker.js" ]]; then
            echo "❌ _worker.js 文件不存在"
            exit 1
          fi
          
          # 创建轻量级混淆配置
          cat > obfuscator-config.json << EOF
          {
            "compact": true,
            "controlFlowFlattening": false,
            "deadCodeInjection": false,
            "debugProtection": false,
            "disableConsoleOutput": false,
            "identifierNamesGenerator": "mangled",
            "log": false,
            "numbersToExpressions": false,
            "renameGlobals": false,
            "selfDefending": true,
            "simplify": true,
            "splitStrings": false,
            "stringArray": false,
            "unicodeEscapeSequence": false,
            "target": "browser"
          }
          EOF
          
          echo "🛠️ 使用轻量级混淆配置..."
          javascript-obfuscator _worker.js --output _worker.js --config obfuscator-config.json
          
          # 最终文件大小检查
          FINAL_SIZE=$(stat -c%s _worker.js 2>/dev/null || stat -f%z _worker.js 2>/dev/null)
          echo "✅ 最终文件大小: $FINAL_SIZE 字节"
          
          # 清理配置文件
          rm -f obfuscator-config.json
          
          # 记录新版本
          echo "$REMOTE_VERSION" > version.txt
          echo "📝 版本记录已更新"

      - name: 📝 提交更改
        if: env.UPDATE_NEEDED == 'true'
        run: |
          echo "📝 $(date '+%Y-%m-%d %H:%M:%S') - 准备提交更改..."
          
          # 显示文件状态
          echo "📁 文件状态:"
          git status --short
          
          # 添加所有更改
          git add -A
          
          # 检查是否有实际更改
          if git diff --staged --quiet; then
            echo "ℹ️ 没有检测到实际更改，跳过提交"
            exit 0
          fi
          
          # 提交更改
          git commit -m "🔄 Auto Update Worker

          • 下载原始文件保存为 source.js
          • 生成优化后的 _worker.js
          • 源文件版本哈希: ${{ env.REMOTE_VERSION }}
          • 更新原因: ${{ env.UPDATE_REASON }}
          • 处理时间: $(date '+%Y-%m-%d %H:%M:%S')
          
          📁 包含文件:
          - source.js (原始文件)
          - _worker.js (优化后文件) 
          - version.txt (版本记录)
          
          [自动同步]"
          
          # 推送更改
          echo "🚀 推送更改到远程仓库..."
          git push
          echo "✅ 提交和推送完成"

      - name: 🎉 更新完成
        if: env.UPDATE_NEEDED == 'true'
        run: |
          echo "🎉 $(date '+%Y-%m-%d %H:%M:%S') - 自动更新完成！"
          echo "::notice title=更新完成::已成功同步文件"
          echo "📋 更新摘要:"
          echo "   • 更新原因: $UPDATE_REASON"
          echo "   • 源文件版本: ${REMOTE_VERSION:0:16}..."
          SOURCE_SIZE=$(stat -c%s source.js 2>/dev/null || stat -f%z source.js 2>/dev/null)
          FINAL_SIZE=$(stat -c%s _worker.js 2>/dev/null || stat -f%z _worker.js 2>/dev/null)
          echo "   • source.js 大小: $SOURCE_SIZE 字节"
          echo "   • _worker.js 大小: $FINAL_SIZE 字节"
          echo "   • 处理时间: $(date '+%Y-%m-%d %H:%M:%S')"

      - name: 😴 无需更新
        if: env.UPDATE_NEEDED == 'false'
        run: |
          echo "😴 $(date '+%Y-%m-%d %H:%M:%S') - 当前已是最新版本，无需更新"
          echo "::notice title=状态检查::当前已是最新版本"
          echo "📋 文件状态:"
          echo "   • version.txt: $HAS_VERSION"
          echo "   • source.js: $HAS_SOURCE" 
          echo "   • _worker.js: $HAS_WORKER"
