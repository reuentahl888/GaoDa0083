name: 🔄 Auto Update Worker

on:
  push:
    branches: [ main ]
  schedule:
    - cron: "0 1 * * *"  # 🕐 每天凌晨1点自动运行
  workflow_dispatch:      # 🖐️ 支持手动触发

permissions:
  contents: write

jobs:
  update:
    name: 🚀 同步和混淆 Worker 文件
    runs-on: ubuntu-latest
    steps:
      - name: 📥 初始化代码仓库
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 🔧 配置 Git 和安装依赖
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global pull.rebase false
          
          # 安装必要的工具
          echo "📦 安装代码处理工具..."
          npm install -g javascript-obfuscator terser

      - name: 🔍 检查文件状态
        id: check_files
        run: |
          echo "🔍 $(date '+%Y-%m-%d %H:%M:%S') - 检查文件状态..."
          
          if [[ -f "version.txt" ]]; then
            LOCAL_VERSION=$(cat version.txt)
            echo "✅ version.txt 存在，版本: $LOCAL_VERSION"
            echo "HAS_VERSION=true" >> $GITHUB_ENV
          else
            echo "📝 version.txt 不存在"
            echo "HAS_VERSION=false" >> $GITHUB_ENV
          fi
          
          # 如果有任何一个文件不存在，就强制更新
          if [[ "$HAS_VERSION" == "false" || ! -f "source.js" || ! -f "_worker.js" ]]; then
            echo "🔄 检测到文件缺失，需要强制更新"
            echo "FORCE_UPDATE=true" >> $GITHUB_ENV
          else
            echo "FORCE_UPDATE=false" >> $GITHUB_ENV
          fi

      - name: 🌐 获取远程文件信息
        id: remote_info
        run: |
          echo "🌍 $(date '+%Y-%m-%d %H:%M:%S') - 正在获取远程文件..."
          RAW_URL="https://raw.githubusercontent.com/cmliu/edgetunnel/refs/heads/main/_worker.js"
          
          for i in {1..3}; do
            echo "🔁 第 $i 次尝试获取远程文件..."
            if curl -f -s -o /tmp/remote_worker.js "$RAW_URL"; then
              FILE_SIZE=$(stat -c%s /tmp/remote_worker.js 2>/dev/null || stat -f%z /tmp/remote_worker.js 2>/dev/null)
              if [[ $FILE_SIZE -gt 1000 ]]; then
                FILE_HASH=$(sha256sum /tmp/remote_worker.js | cut -d' ' -f1)
                echo "✅ 远程文件获取成功，大小: $FILE_SIZE 字节，哈希: ${FILE_HASH:0:16}..."
                echo "REMOTE_VERSION=$FILE_HASH" >> $GITHUB_ENV
                break
              fi
            fi
            
            if [[ $i -eq 3 ]]; then
              echo "❌ 获取远程文件失败"
              exit 1
            fi
            sleep 5
          done

      - name: 📊 版本比对和更新决策
        id: update_decision
        run: |
          echo "📊 $(date '+%Y-%m-%d %H:%M:%S') - 版本比对和更新决策..."
          
          if [[ "$FORCE_UPDATE" == "true" ]]; then
            echo "🔄 文件缺失，强制更新"
            echo "UPDATE_NEEDED=true" >> $GITHUB_ENV
          elif [[ -f "version.txt" ]]; then
            LOCAL_VERSION=$(cat version.txt)
            if [[ "$LOCAL_VERSION" == "$REMOTE_VERSION" ]]; then
              echo "🎉 版本一致，无需更新"
              echo "UPDATE_NEEDED=false" >> $GITHUB_ENV
            else
              echo "🔄 检测到新版本，需要更新"
              echo "UPDATE_NEEDED=true" >> $GITHUB_ENV
            fi
          else
            echo "🔄 首次运行，需要更新"
            echo "UPDATE_NEEDED=true" >> $GITHUB_ENV
          fi

      - name: ⬇️ 下载原始文件
        if: env.UPDATE_NEEDED == 'true'
        run: |
          echo "⬇️ $(date '+%Y-%m-%d %H:%M:%S') - 保存原始文件..."
          cp /tmp/remote_worker.js source.js
          echo "✅ source.js 保存成功"

      - name: 🔒 使用推荐配置进行混淆
        if: env.UPDATE_NEEDED == 'true'
        run: |
          echo "🔒 $(date '+%Y-%m-%d %H:%M:%S') - 开始代码混淆..."
          
          # 创建推荐的混淆配置
          cat > obfuscator-config.json << 'EOF'
          {
            "compact": true,
            "controlFlowFlattening": false,
            "deadCodeInjection": false,
            "debugProtection": false,
            "identifierNamesGenerator": "mangled",
            "numbersToExpressions": false,
            "renameGlobals": false,
            "selfDefending": true,
            "simplify": true,
            "splitStrings": false,
            "stringArray": true,
            "stringArrayEncoding": [],
            "stringArrayThreshold": 0.75,
            "unicodeEscapeSequence": false
          }
          EOF
          
          echo "🛠️ 使用推荐配置进行混淆..."
          javascript-obfuscator /tmp/remote_worker.js --output _worker.js --config obfuscator-config.json
          
          # 检查混淆后文件大小
          if [[ -f "_worker.js" ]]; then
            OBFUSCATED_SIZE=$(stat -c%s _worker.js 2>/dev/null || stat -f%z _worker.js 2>/dev/null)
            ORIGINAL_SIZE=$(stat -c%s source.js 2>/dev/null || stat -f%z source.js 2>/dev/null)
            
            echo "📊 混淆报告:"
            echo "   • 原始大小: $ORIGINAL_SIZE 字节"
            echo "   • 混淆后大小: $OBFUSCATED_SIZE 字节"
            echo "   • 大小变化: $(( (OBFUSCATED_SIZE * 100) / ORIGINAL_SIZE ))%"
            
            # 如果混淆后文件太大，使用 terser 压缩
            if [[ $OBFUSCATED_SIZE -gt 500000 ]]; then
              echo "⚠️ 混淆后文件较大，使用 terser 进一步压缩..."
              terser _worker.js --compress --mangle --output _worker.js
              
              COMPRESSED_SIZE=$(stat -c%s _worker.js 2>/dev/null || stat -f%z _worker.js 2>/dev/null)
              echo "✅ 二次压缩后大小: $COMPRESSED_SIZE 字节"
            fi
          else
            echo "❌ 混淆失败，使用原始文件"
            cp /tmp/remote_worker.js _worker.js
          fi
          
          # 清理配置文件
          rm -f obfuscator-config.json
          
          # 最终大小检查
          FINAL_SIZE=$(stat -c%s _worker.js 2>/dev/null || stat -f%z _worker.js 2>/dev/null)
          if [[ $FINAL_SIZE -gt 1048576 ]]; then
            echo "⚠️ 警告：最终文件超过 1MB，可能影响 Cloudflare Worker 部署"
            echo "::warning title=文件大小警告::最终文件大小: $FINAL_SIZE 字节"
          else
            echo "✅ 文件大小在安全范围内"
          fi

      - name: 📝 提交更改
        if: env.UPDATE_NEEDED == 'true'
        run: |
          echo "📝 $(date '+%Y-%m-%d %H:%M:%S') - 准备提交更改..."
          
          # 记录版本
          echo "$REMOTE_VERSION" > version.txt
          
          # 添加文件
          git add source.js _worker.js version.txt
          
          # 检查是否有更改
          if git diff --staged --quiet; then
            echo "ℹ️ 没有检测到更改，跳过提交"
            exit 0
          fi
          
          # 获取文件大小信息
          SOURCE_SIZE=$(stat -c%s source.js 2>/dev/null || stat -f%z source.js 2>/dev/null)
          WORKER_SIZE=$(stat -c%s _worker.js 2>/dev/null || stat -f%z _worker.js 2>/dev/null)
          
          # 提交
          git commit -m "🔄 Auto Update Worker with Obfuscation

          • 同步最新 Worker 文件
          • 版本: ${REMOTE_VERSION:0:16}...
          • 源文件: $SOURCE_SIZE 字节
          • 混淆后: $WORKER_SIZE 字节
          • 使用推荐混淆配置
          • 更新时间: $(date '+%Y-%m-%d %H:%M:%S')
          
          [自动同步和混淆]"
          
          git push
          echo "✅ 提交完成"

      - name: 🎉 更新完成
        if: env.UPDATE_NEEDED == 'true'
        run: |
          echo "🎉 $(date '+%Y-%m-%d %H:%M:%S') - 自动更新完成！"
          echo "::notice title=更新完成::已成功同步并混淆代码"
          echo "📋 最终报告:"
          echo "   • 源文件大小: $(stat -c%s source.js 2>/dev/null || stat -f%z source.js 2>/dev/null) 字节"
          echo "   • 混淆文件大小: $(stat -c%s _worker.js 2>/dev/null || stat -f%z _worker.js 2>/dev/null) 字节"
          echo "   • 版本哈希: ${REMOTE_VERSION:0:16}..."

      - name: 😴 无需更新
        if: env.UPDATE_NEEDED == 'false'
        run: |
          echo "😴 $(date '+%Y-%m-%d %H:%M:%S') - 当前已是最新版本，无需更新"
