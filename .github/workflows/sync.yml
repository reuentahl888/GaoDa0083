name: 🔄 Auto Update Worker

on:
  push:
    branches: [ main ]
  schedule:
    - cron: "0 1 * * *"  # 🕐 每天凌晨1点自动运行
  workflow_dispatch:      # 🖐️ 支持手动触发

# 限制工作流日志保留数量
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    name: 🚀 同步和优化 Worker 文件
    runs-on: ubuntu-latest
    
    # 限制日志保留策略
    timeout-minutes: 10
    
    steps:
      - name: 📥 初始化代码仓库
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 🔧 配置 Git 和安装依赖
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global pull.rebase false
          
          # 安装必要的工具
          echo "📦 安装代码处理工具..."
          npm install -g terser

      - name: 🔍 检查文件状态
        id: check_files
        run: |
          echo "🔍 检查文件状态..."
          
          if [[ -f "version.txt" ]]; then
            LOCAL_VERSION=$(cat version.txt)
            echo "✅ version.txt 存在"
            echo "HAS_VERSION=true" >> $GITHUB_ENV
          else
            echo "📝 version.txt 不存在"
            echo "HAS_VERSION=false" >> $GITHUB_ENV
          fi
          
          if [[ "$HAS_VERSION" == "false" || ! -f "source.js" || ! -f "_worker.js" ]]; then
            echo "🔄 检测到文件缺失，需要强制更新"
            echo "FORCE_UPDATE=true" >> $GITHUB_ENV
          else
            echo "FORCE_UPDATE=false" >> $GITHUB_ENV
          fi

      - name: 🌐 获取远程文件信息
        id: remote_info
        run: |
          echo "🌍 获取远程文件..."
          RAW_URL="https://raw.githubusercontent.com/cmliu/edgetunnel/refs/heads/main/_worker.js"
          
          for i in {1..3}; do
            echo "尝试 $i/3..."
            if curl -f -s -o /tmp/remote_worker.js "$RAW_URL"; then
              FILE_SIZE=$(stat -c%s /tmp/remote_worker.js 2>/dev/null || stat -f%z /tmp/remote_worker.js 2>/dev/null)
              if [[ $FILE_SIZE -gt 1000 ]]; then
                FILE_HASH=$(sha256sum /tmp/remote_worker.js | cut -d' ' -f1)
                echo "✅ 远程文件获取成功"
                echo "REMOTE_VERSION=$FILE_HASH" >> $GITHUB_ENV
                break
              fi
            fi
            sleep 2
          done

      - name: 📊 版本比对
        id: update_decision
        run: |
          echo "📊 版本比对..."
          
          if [[ "$FORCE_UPDATE" == "true" ]]; then
            echo "🔄 文件缺失，强制更新"
            echo "UPDATE_NEEDED=true" >> $GITHUB_ENV
          elif [[ -f "version.txt" ]]; then
            LOCAL_VERSION=$(cat version.txt)
            if [[ "$LOCAL_VERSION" == "$REMOTE_VERSION" ]]; then
              echo "🎉 版本一致，无需更新"
              echo "UPDATE_NEEDED=false" >> $GITHUB_ENV
            else
              echo "🔄 检测到新版本，需要更新"
              echo "UPDATE_NEEDED=true" >> $GITHUB_ENV
            fi
          else
            echo "🔄 首次运行，需要更新"
            echo "UPDATE_NEEDED=true" >> $GITHUB_ENV
          fi

      - name: ⬇️ 下载原始文件
        if: env.UPDATE_NEEDED == 'true'
        run: |
          echo "⬇️ 保存原始文件..."
          cp /tmp/remote_worker.js source.js
          echo "✅ source.js 保存成功"

      - name: 🔒 字符串混淆
        if: env.UPDATE_NEEDED == 'true'
        run: |
          echo "🔒 字符串混淆..."
          
          # 创建字符串混淆处理脚本
          cat > string-obfuscator.js << 'EOF'
          const fs = require('fs');
          const { execSync } = require('child_process');
          
          function simpleStringObfuscation(code) {
            // 简化的字符串混淆 - 只处理较长的字符串
            return code.replace(/['"`]([^'"`]{10,})['"`]/g, (match, content) => {
              const charCodes = Array.from(content).map(c => c.charCodeAt(0));
              return `String.fromCharCode(${charCodes.join(',')})`;
            });
          }
          
          function base64Obfuscation(code) {
            // 使用 Base64 编码字符串
            return code.replace(/['"`]([^'"`]{6,})['"`]/g, (match, content) => {
              try {
                const base64 = Buffer.from(content).toString('base64');
                return `atob('${base64}')`;
              } catch (e) {
                return match;
              }
            });
          }
          
          const sourceCode = fs.readFileSync('/tmp/remote_worker.js', 'utf8');
          let obfuscatedCode = sourceCode;
          
          obfuscatedCode = simpleStringObfuscation(obfuscatedCode);
          obfuscatedCode = base64Obfuscation(obfuscatedCode);
          
          fs.writeFileSync('/tmp/obfuscated.js', obfuscatedCode);
          execSync('terser /tmp/obfuscated.js --compress --mangle --output _worker.js');
          
          console.log('✅ 字符串混淆完成');
          EOF
          
          node string-obfuscator.js
          rm -f string-obfuscator.js /tmp/obfuscated.js

      - name: 📝 提交更改
        if: env.UPDATE_NEEDED == 'true'
        run: |
          echo "📝 提交更改..."
          
          echo "$REMOTE_VERSION" > version.txt
          git add source.js _worker.js version.txt
          
          if git diff --staged --quiet; then
            echo "ℹ️ 没有更改，跳过提交"
            exit 0
          fi
          
          SOURCE_SIZE=$(stat -c%s source.js 2>/dev/null || stat -f%z source.js 2>/dev/null)
          WORKER_SIZE=$(stat -c%s _worker.js 2>/dev/null || stat -f%z _worker.js 2>/dev/null)
          
          git commit -m "🔄 Auto Update Worker - ${{ env.REMOTE_VERSION }}"
          git push
          echo "✅ 提交完成"

      - name: 🎉 更新完成
        if: env.UPDATE_NEEDED == 'true'
        run: |
          echo "🎉 自动更新完成！"

      - name: 😴 无需更新
        if: env.UPDATE_NEEDED == 'false'
        run: |
          echo "😴 当前已是最新版本"
