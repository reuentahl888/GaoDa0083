name: 🔄 Auto Update Worker

on:
  push:
    branches: [ main ]
  schedule:
    - cron: "0 1 * * *"  # 🕐 每天凌晨1点自动运行
  workflow_dispatch:      # 🖐️ 支持手动触发

permissions:
  contents: write

jobs:
  update:
    name: 🚀 同步和优化 Worker 文件
    runs-on: ubuntu-latest
    steps:
      - name: 📥 初始化代码仓库
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 🔧 配置 Git 和安装依赖
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global pull.rebase false
          
          # 安装必要的工具
          echo "📦 安装代码处理工具..."
          npm install -g terser

      - name: 🔍 检查文件状态
        id: check_files
        run: |
          echo "🔍 $(date '+%Y-%m-%d %H:%M:%S') - 检查文件状态..."
          
          if [[ -f "version.txt" ]]; then
            LOCAL_VERSION=$(cat version.txt)
            echo "✅ version.txt 存在，版本: $LOCAL_VERSION"
            echo "HAS_VERSION=true" >> $GITHUB_ENV
          else
            echo "📝 version.txt 不存在"
            echo "HAS_VERSION=false" >> $GITHUB_ENV
          fi
          
          # 如果有任何一个文件不存在，就强制更新
          if [[ "$HAS_VERSION" == "false" || ! -f "source.js" || ! -f "_worker.js" ]]; then
            echo "🔄 检测到文件缺失，需要强制更新"
            echo "FORCE_UPDATE=true" >> $GITHUB_ENV
          else
            echo "FORCE_UPDATE=false" >> $GITHUB_ENV
          fi

      - name: 🌐 获取远程文件信息
        id: remote_info
        run: |
          echo "🌍 $(date '+%Y-%m-%d %H:%M:%S') - 正在获取远程文件..."
          RAW_URL="https://raw.githubusercontent.com/cmliu/edgetunnel/refs/heads/main/_worker.js"
          
          for i in {1..3}; do
            echo "🔁 第 $i 次尝试获取远程文件..."
            if curl -f -s -o /tmp/remote_worker.js "$RAW_URL"; then
              FILE_SIZE=$(stat -c%s /tmp/remote_worker.js 2>/dev/null || stat -f%z /tmp/remote_worker.js 2>/dev/null)
              if [[ $FILE_SIZE -gt 1000 ]]; then
                FILE_HASH=$(sha256sum /tmp/remote_worker.js | cut -d' ' -f1)
                echo "✅ 远程文件获取成功，大小: $FILE_SIZE 字节，哈希: ${FILE_HASH:0:16}..."
                echo "REMOTE_VERSION=$FILE_HASH" >> $GITHUB_ENV
                break
              fi
            fi
            
            if [[ $i -eq 3 ]]; then
              echo "❌ 获取远程文件失败"
              exit 1
            fi
            sleep 5
          done

      - name: 📊 版本比对和更新决策
        id: update_decision
        run: |
          echo "📊 $(date '+%Y-%m-%d %H:%M:%S') - 版本比对和更新决策..."
          
          if [[ "$FORCE_UPDATE" == "true" ]]; then
            echo "🔄 文件缺失，强制更新"
            echo "UPDATE_NEEDED=true" >> $GITHUB_ENV
          elif [[ -f "version.txt" ]]; then
            LOCAL_VERSION=$(cat version.txt)
            if [[ "$LOCAL_VERSION" == "$REMOTE_VERSION" ]]; then
              echo "🎉 版本一致，无需更新"
              echo "UPDATE_NEEDED=false" >> $GITHUB_ENV
            else
              echo "🔄 检测到新版本，需要更新"
              echo "UPDATE_NEEDED=true" >> $GITHUB_ENV
            fi
          else
            echo "🔄 首次运行，需要更新"
            echo "UPDATE_NEEDED=true" >> $GITHUB_ENV
          fi

      - name: ⬇️ 下载原始文件
        if: env.UPDATE_NEEDED == 'true'
        run: |
          echo "⬇️ $(date '+%Y-%m-%d %H:%M:%S') - 保存原始文件..."
          cp /tmp/remote_worker.js source.js
          echo "✅ source.js 保存成功"

      - name: 🔒 字符串混淆和优化
        if: env.UPDATE_NEEDED == 'true'
        run: |
          echo "🔒 $(date '+%Y-%m-%d %H:%M:%S') - 开始字符串混淆和优化..."
          
          # 创建字符串混淆处理脚本
          cat > string-obfuscator.js << 'EOF'
          const fs = require('fs');
          
          function obfuscateStrings(code) {
            // 匹配字符串常量（单引号、双引号、模板字符串）
            const stringRegex = /(['"`])(?:(?=(\\?))\2.)*?\1/g;
            const strings = [];
            let obfuscatedCode = code;
            
            // 第一步：收集所有字符串并替换为占位符
            obfuscatedCode = obfuscatedCode.replace(stringRegex, (match) => {
              // 跳过太短的字符串和可能是正则表达式的情况
              if (match.length <= 2) return match;
              
              const index = strings.length;
              strings.push(match);
              return `__STR_${index}__`;
            });
            
            // 第二步：添加解码函数和字符串数组
            const decodeFunction = `
            const __decode=(s)=>s.replace(/__STR_(\\d+)__/g,(m,n)=>[${strings.map(s => 
              // 对字符串进行简单编码：Base64 或字符编码
              Buffer.from(s).toString('base64')
            ).join(',')}][n]?atob([${strings.map(s => 
              Buffer.from(s).toString('base64')
            ).join(',')}][n]):m);
            `;
            
            // 第三步：包装代码
            obfuscatedCode = decodeFunction + '\n__decode(`' + obfuscatedCode.replace(/`/g, '\\`') + '`);';
            
            return obfuscatedCode;
          }
          
          function simpleStringObfuscation(code) {
            // 简化的字符串混淆 - 只处理较长的字符串
            return code.replace(/['"`]([^'"`]{10,})['"`]/g, (match, content) => {
              // 将字符串转换为字符编码数组
              const charCodes = Array.from(content).map(c => c.charCodeAt(0));
              return `String.fromCharCode(${charCodes.join(',')})`;
            });
          }
          
          function base64Obfuscation(code) {
            // 使用 Base64 编码字符串
            return code.replace(/['"`]([^'"`]{4,})['"`]/g, (match, content) => {
              try {
                const base64 = Buffer.from(content).toString('base64');
                return `atob('${base64}')`;
              } catch (e) {
                return match; // 编码失败则保持原样
              }
            });
          }
          
          // 读取源文件
          const sourceCode = fs.readFileSync('/tmp/remote_worker.js', 'utf8');
          
          let obfuscatedCode = sourceCode;
          
          // 应用基础混淆
          console.log('🔧 应用基础字符串混淆...');
          obfuscatedCode = simpleStringObfuscation(obfuscatedCode);
          
          // 应用 Base64 混淆（对较长的字符串）
          console.log('🔧 应用 Base64 混淆...');
          obfuscatedCode = base64Obfuscation(obfuscatedCode);
          
          // 使用 terser 压缩
          const { execSync } = require('child_process');
          fs.writeFileSync('/tmp/obfuscated.js', obfuscatedCode);
          execSync('terser /tmp/obfuscated.js --compress --mangle --output _worker.js');
          
          console.log('✅ 字符串混淆完成');
          EOF
          
          # 运行字符串混淆
          echo "🛠️ 运行字符串混淆..."
          node string-obfuscator.js
          
          # 清理临时文件
          rm -f string-obfuscator.js /tmp/obfuscated.js
          
          # 验证结果
          if [[ -f "_worker.js" ]]; then
            FINAL_SIZE=$(stat -c%s _worker.js 2>/dev/null || stat -f%z _worker.js 2>/dev/null)
            ORIGINAL_SIZE=$(stat -c%s source.js 2>/dev/null || stat -f%z source.js 2>/dev/null)
            
            echo "📊 混淆报告:"
            echo "   • 原始大小: $ORIGINAL_SIZE 字节"
            echo "   • 混淆后大小: $FINAL_SIZE 字节"
            echo "   • 大小变化: $(( (FINAL_SIZE * 100) / ORIGINAL_SIZE ))%"
            
            # 检查混淆效果
            STRING_COUNT=$(grep -o "fromCharCode\\|atob" _worker.js | wc -l || true)
            echo "   • 混淆的字符串数量: $STRING_COUNT"
          else
            echo "❌ 混淆失败，使用原始文件"
            cp /tmp/remote_worker.js _worker.js
          fi

      - name: 🔧 额外优化（如果需要）
        if: env.UPDATE_NEEDED == 'true'
        run: |
          echo "🔧 $(date '+%Y-%m-%d %H:%M:%S') - 检查是否需要额外优化..."
          
          CURRENT_SIZE=$(stat -c%s _worker.js 2>/dev/null || stat -f%z _worker.js 2>/dev/null)
          
          if [[ $CURRENT_SIZE -gt 400000 ]]; then
            echo "⚡ 文件较大，进行额外压缩..."
            terser _worker.js \
              --compress passes=2 \
              --mangle \
              --output _worker.js
            
            FINAL_SIZE=$(stat -c%s _worker.js 2>/dev/null || stat -f%z _worker.js 2>/dev/null)
            echo "✅ 额外压缩后大小: $FINAL_SIZE 字节"
          fi

      - name: 🔍 代码安全检查
        if: env.UPDATE_NEEDED == 'true'
        run: |
          echo "🔍 $(date '+%Y-%m-%d %H:%M:%S') - 代码安全检查..."
          
          if [[ -f "_worker.js" ]]; then
            # 检查关键功能是否完整
            ESSENTIAL_FUNCTIONS=0
            ESSENTIAL_FUNCTIONS=$((ESSENTIAL_FUNCTIONS + $(grep -c "addEventListener" _worker.js || true)))
            ESSENTIAL_FUNCTORS=$((ESSENTIAL_FUNCTIONS + $(grep -c "fetch" _worker.js || true)))
            ESSENTIAL_FUNCTIONS=$((ESSENTIAL_FUNCTIONS + $(grep -c "Response" _worker.js || true)))
            
            echo "📋 功能完整性检查:"
            echo "   • 发现 $ESSENTIAL_FUNCTIONS 个关键函数"
            
            if [[ $ESSENTIAL_FUNCTIONS -eq 0 ]]; then
              echo "❌ 警告：可能丢失关键功能"
              echo "::warning title=功能完整性::请检查混淆后的代码功能"
            else
              echo "✅ 关键功能完整"
            fi
            
            # 检查文件大小限制
            FINAL_SIZE=$(stat -c%s _worker.js 2>/dev/null || stat -f%z _worker.js 2>/dev/null)
            if [[ $FINAL_SIZE -gt 1048576 ]]; then
              echo "⚠️ 警告：文件超过 1MB，可能影响部署"
            fi
          fi

      - name: 📝 提交更改
        if: env.UPDATE_NEEDED == 'true'
        run: |
          echo "📝 $(date '+%Y-%m-%d %H:%M:%S') - 准备提交更改..."
          
          # 记录版本
          echo "$REMOTE_VERSION" > version.txt
          
          # 添加文件
          git add source.js _worker.js version.txt
          
          # 检查是否有更改
          if git diff --staged --quiet; then
            echo "ℹ️ 没有检测到更改，跳过提交"
            exit 0
          fi
          
          # 获取文件大小信息
          SOURCE_SIZE=$(stat -c%s source.js 2>/dev/null || stat -f%z source.js 2>/dev/null)
          WORKER_SIZE=$(stat -c%s _worker.js 2>/dev/null || stat -f%z _worker.js 2>/dev/null)
          
          # 提交
          git commit -m "🔄 Auto Update Worker - String Obfuscation

          • 同步最新 Worker 文件
          • 版本: ${REMOTE_VERSION:0:16}...
          • 源文件: $SOURCE_SIZE 字节
          • 混淆后: $WORKER_SIZE 字节
          • 应用字符串混淆技术
          • 更新时间: $(date '+%Y-%m-%d %H:%M:%S')
          
          [自动同步和字符串混淆]"
          
          git push
          echo "✅ 提交完成"

      - name: 🎉 更新完成
        if: env.UPDATE_NEEDED == 'true'
        run: |
          echo "🎉 $(date '+%Y-%m-%d %H:%M:%S') - 自动更新完成！"
          echo "::notice title=更新完成::已成功应用字符串混淆"

      - name: 😴 无需更新
        if: env.UPDATE_NEEDED == 'false'
        run: |
          echo "😴 $(date '+%Y-%m-%d %H:%M:%S') - 当前已是最新版本，无需更新"
