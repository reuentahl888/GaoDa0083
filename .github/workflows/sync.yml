name: 🔄 Auto Update Worker

on:
  push:
    branches: [ main ]
  schedule:
    - cron: "0 1 * * *"  # 🕐 每天凌晨1点自动运行
  workflow_dispatch:      # 🖐️ 支持手动触发

permissions:
  contents: write

# 限制工作流日志保留数量
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  WORKFLOW_RETENTION_DAYS: 3

jobs:
  cleanup-old-workflows:
    name: 🧹 清理旧工作流日志
    runs-on: ubuntu-latest
    steps:
      - name: 🔍 列出工作流运行
        uses: actions/github-script@v6
        with:
          script: |
            const { data: runs } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: context.workflow,
              per_page: 100
            });
            
            // 按创建时间排序，最新的在前面
            const sortedRuns = runs.workflow_runs.sort((a, b) => 
              new Date(b.created_at) - new Date(a.created_at)
            );
            
            // 保留最新的3个运行
            const runsToDelete = sortedRuns.slice(3);
            
            console.log(`找到 ${sortedRuns.length} 个工作流运行`);
            console.log(`将保留最新的 3 个，删除 ${runsToDelete.length} 个旧运行`);
            
            // 删除旧的运行
            for (const run of runsToDelete) {
              console.log(`删除运行 #${run.id} (${run.status}, ${run.conclusion}) - 创建于 ${run.created_at}`);
              try {
                await github.rest.actions.deleteWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id
                });
                console.log(`✅ 成功删除运行 #${run.id}`);
              } catch (error) {
                console.log(`❌ 删除运行 #${run.id} 失败: ${error.message}`);
              }
            }

  update:
    name: 🚀 同步和优化 Worker 文件
    runs-on: ubuntu-latest
    needs: cleanup-old-workflows
    steps:
      - name: 📥 初始化代码仓库
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 🔧 配置 Git 和安装依赖
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global pull.rebase false
          
          # 安装必要的工具
          echo "📦 安装代码处理工具..."
          npm install -g terser

      - name: 🔍 检查文件状态
        id: check_files
        run: |
          echo "🔍 $(date '+%Y-%m-%d %H:%M:%S') - 检查文件状态..."
          
          if [[ -f "version.txt" ]]; then
            LOCAL_VERSION=$(cat version.txt)
            echo "✅ version.txt 存在，版本: $LOCAL_VERSION"
            echo "HAS_VERSION=true" >> $GITHUB_ENV
          else
            echo "📝 version.txt 不存在"
            echo "HAS_VERSION=false" >> $GITHUB_ENV
          fi
          
          # 如果有任何一个文件不存在，就强制更新
          if [[ "$HAS_VERSION" == "false" || ! -f "source.js" || ! -f "_worker.js" ]]; then
            echo "🔄 检测到文件缺失，需要强制更新"
            echo "FORCE_UPDATE=true" >> $GITHUB_ENV
          else
            echo "FORCE_UPDATE=false" >> $GITHUB_ENV
          fi

      - name: 🌐 获取远程文件信息
        id: remote_info
        run: |
          echo "🌍 $(date '+%Y-%m-%d %H:%M:%S') - 正在获取远程文件..."
          RAW_URL="https://raw.githubusercontent.com/cmliu/edgetunnel/refs/heads/main/_worker.js"
          
          for i in {1..3}; do
            echo "🔁 第 $i 次尝试获取远程文件..."
            if curl -f -s -o /tmp/remote_worker.js "$RAW_URL"; then
              FILE_SIZE=$(stat -c%s /tmp/remote_worker.js 2>/dev/null || stat -f%z /tmp/remote_worker.js 2>/dev/null)
              if [[ $FILE_SIZE -gt 1000 ]]; then
                FILE_HASH=$(sha256sum /tmp/remote_worker.js | cut -d' ' -f1)
                echo "✅ 远程文件获取成功，大小: $FILE_SIZE 字节，哈希: ${FILE_HASH:0:16}..."
                echo "REMOTE_VERSION=$FILE_HASH" >> $GITHUB_ENV
                break
              fi
            fi
            
            if [[ $i -eq 3 ]]; then
              echo "❌ 获取远程文件失败"
              exit 1
            fi
            sleep 5
          done

      - name: 📊 版本比对和更新决策
        id: update_decision
        run: |
          echo "📊 $(date '+%Y-%m-%d %H:%M:%S') - 版本比对和更新决策..."
          
          if [[ "$FORCE_UPDATE" == "true" ]]; then
            echo "🔄 文件缺失，强制更新"
            echo "UPDATE_NEEDED=true" >> $GITHUB_ENV
          elif [[ -f "version.txt" ]]; then
            LOCAL_VERSION=$(cat version.txt)
            if [[ "$LOCAL_VERSION" == "$REMOTE_VERSION" ]]; then
              echo "🎉 版本一致，无需更新"
              echo "UPDATE_NEEDED=false" >> $GITHUB_ENV
            else
              echo "🔄 检测到新版本，需要更新"
              echo "UPDATE_NEEDED=true" >> $GITHUB_ENV
            fi
          else
            echo "🔄 首次运行，需要更新"
            echo "UPDATE_NEEDED=true" >> $GITHUB_ENV
          fi

      - name: ⬇️ 下载原始文件
        if: env.UPDATE_NEEDED == 'true'
        run: |
          echo "⬇️ $(date '+%Y-%m-%d %H:%M:%S') - 保存原始文件..."
          cp /tmp/remote_worker.js source.js
          echo "✅ source.js 保存成功"

      - name: 🔧 轻量级优化（避免CPU超限）
        if: env.UPDATE_NEEDED == 'true'
        run: |
          echo "🔧 $(date '+%Y-%m-%d %H:%M:%S') - 开始轻量级优化..."
          
          # 方法1: 仅使用 terser 进行基本压缩
          echo "🛠️ 使用 terser 进行基本压缩..."
          terser /tmp/remote_worker.js \
            --compress defaults=false,unused=true,dead_code=true \
            --mangle toplevel=false \
            --output _worker.js
          
          # 检查压缩后文件
          if [[ -f "_worker.js" ]]; then
            SIZE_1=$(stat -c%s _worker.js 2>/dev/null || stat -f%z _worker.js 2>/dev/null)
            echo "📏 基本压缩后大小: $SIZE_1 字节"
            
            # 如果文件仍然复杂，尝试进一步简化
            if [[ $SIZE_1 -gt 300000 ]]; then
              echo "⚡ 文件较大，进行额外优化..."
              
              # 使用独立的 Node.js 脚本进行简化
              node -e "
              const fs = require('fs');
              const code = fs.readFileSync('/tmp/remote_worker.js', 'utf8');
              
              // 移除注释
              let simplified = code.replace(/\\/\\*[\\s\\S]*?\\*\\//g, '');
              simplified = simplified.replace(/\\/\\/.*\$/gm, '');
              
              // 移除空行和多余空格
              simplified = simplified.split('\\n')
                .filter(line => line.trim().length > 0)
                .map(line => line.trim())
                .join('\\n');
              
              fs.writeFileSync('_worker.js', simplified);
              console.log('简化完成');
              "
              
              SIZE_2=$(stat -c%s _worker.js 2>/dev/null || stat -f%z _worker.js 2>/dev/null)
              echo "📏 简化后大小: $SIZE_2 字节"
            fi
          else
            echo "❌ 压缩失败，使用原始文件"
            cp /tmp/remote_worker.js _worker.js
          fi
          
          # 最终验证
          FINAL_SIZE=$(stat -c%s _worker.js 2>/dev/null || stat -f%z _worker.js 2>/dev/null)
          ORIGINAL_SIZE=$(stat -c%s source.js 2>/dev/null || stat -f%z source.js 2>/dev/null)
          
          echo "📊 优化报告:"
          echo "   • 原始大小: $ORIGINAL_SIZE 字节"
          echo "   • 优化后大小: $FINAL_SIZE 字节"
          echo "   • 优化比例: $(( (FINAL_SIZE * 100) / ORIGINAL_SIZE ))%"
          
          if [[ $FINAL_SIZE -gt 500000 ]]; then
            echo "⚠️ 警告：文件仍然较大，建议手动优化代码结构"
          fi

      - name: 🔍 代码复杂度检查
        if: env.UPDATE_NEEDED == 'true'
        run: |
          echo "🔍 $(date '+%Y-%m-%d %H:%M:%S') - 检查代码复杂度..."
          
          if [[ -f "_worker.js" ]]; then
            # 检查可能引起CPU超限的模式
            COMPLEX_PATTERNS=0
            COMPLEX_PATTERNS=$((COMPLEX_PATTERNS + $(grep -c "eval(" _worker.js || true)))
            COMPLEX_PATTERNS=$((COMPLEX_PATTERNS + $(grep -c "setInterval" _worker.js || true)))
            COMPLEX_PATTERNS=$((COMPLEX_PATTERNS + $(grep -c "setTimeout" _worker.js || true)))
            COMPLEX_PATTERNS=$((COMPLEX_PATTERNS + $(grep -c "Function(" _worker.js || true)))
            COMPLEX_PATTERNS=$((COMPLEX_PATTERNS + $(grep -c "while.*true" _worker.js || true)))
            
            echo "📋 复杂度检查:"
            echo "   • 发现 $COMPLEX_PATTERNS 个可能引起CPU超限的模式"
            
            if [[ $COMPLEX_PATTERNS -gt 5 ]]; then
              echo "❌ 警告：代码包含多个可能引起CPU超限的模式"
              echo "::warning title=CPU超限风险::代码包含 $COMPLEX_PATTERNS 个高风险模式"
            else
              echo "✅ 代码复杂度在可接受范围内"
            fi
          fi

      - name: 📝 提交更改
        if: env.UPDATE_NEEDED == 'true'
        run: |
          echo "📝 $(date '+%Y-%m-%d %H:%M:%S') - 准备提交更改..."
          
          # 记录版本
          echo "$REMOTE_VERSION" > version.txt
          
          # 添加文件
          git add source.js _worker.js version.txt
          
          # 检查是否有更改
          if git diff --staged --quiet; then
            echo "ℹ️ 没有检测到更改，跳过提交"
            exit 0
          fi
          
          # 获取文件大小信息
          SOURCE_SIZE=$(stat -c%s source.js 2>/dev/null || stat -f%z source.js 2>/dev/null)
          WORKER_SIZE=$(stat -c%s _worker.js 2>/dev/null || stat -f%z _worker.js 2>/dev/null)
          
          # 提交
          git commit -m "🔄 Auto Update Worker - CPU Optimized

          • 同步最新 Worker 文件
          • 版本: ${REMOTE_VERSION:0:16}...
          • 源文件: $SOURCE_SIZE 字节
          • 优化后: $WORKER_SIZE 字节
          • 针对CPU时间限制优化
          • 更新时间: $(date '+%Y-%m-%d %H:%M:%S')
          
          [自动同步和优化]"
          
          git push
          echo "✅ 提交完成"

      - name: 🎉 更新完成
        if: env.UPDATE_NEEDED == 'true'
        run: |
          echo "🎉 $(date '+%Y-%m-%d %H:%M:%S') - 自动更新完成！"
          echo "::notice title=更新完成::已成功优化代码以避免CPU超限"

      - name: 😴 无需更新
        if: env.UPDATE_NEEDED == 'false'
        run: |
          echo "😴 $(date '+%Y-%m-%d %H:%M:%S') - 当前已是最新版本，无需更新"
